<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人收藏管理系統 - 雲端版</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyCBK1WIT7zzhFLIiikGQHQ6dXuKqRPNAho",
            authDomain: "collection-3a574.firebaseapp.com",
            projectId: "collection-3a574",
            storageBucket: "collection-3a574.firebasestorage.app",
            messagingSenderId: "521071313829",
            appId: "1:521071313829:web:e708587db68ce7075e1e4c"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.googleProvider = new GoogleAuthProvider();
        window.fbUtils = { collection, doc, setDoc, deleteDoc, onSnapshot, query, signInWithPopup, signOut, onAuthStateChanged };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [items, setItems] = useState([]);
            const [viewMode, setViewMode] = useState('grid');
            const [searchQuery, setSearchQuery] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [imagePreview, setImagePreview] = useState("");

            const [formData, setFormData] = useState({
                name: '', category: '其他', price: '', date: new Date().toISOString().split('T')[0],
                status: '閒置', image: '', description: ''
            });

            // 監聽登入狀態與資料庫
            useEffect(() => {
                if (!window.fbUtils) return;
                const unsubscribeAuth = window.fbUtils.onAuthStateChanged(window.auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                    if (currentUser) {
                        // 依照規則：/artifacts/{appId}/users/{userId}/{collectionName}
                        const q = window.fbUtils.query(window.fbUtils.collection(window.db, 'artifacts', 'collection-app', 'users', currentUser.uid, 'items'));
                        const unsubscribeData = window.fbUtils.onSnapshot(q, (snapshot) => {
                            const data = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
                            setItems(data);
                        }, (err) => console.error("Firestore Error:", err));
                        return () => unsubscribeData();
                    } else {
                        setItems([]);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            // 處理圖片 Base64 轉換
            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 1048576) { // 1MB 限制 (Firestore doc 限制為 1MB)
                        alert("圖片太大囉！請選擇 1MB 以下的圖片。");
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImagePreview(reader.result);
                        setFormData({ ...formData, image: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleLogin = async () => {
                try {
                    await window.fbUtils.signInWithPopup(window.auth, window.googleProvider);
                } catch (error) {
                    console.error("Login Failed", error);
                }
            };

            const handleLogout = () => window.fbUtils.signOut(window.auth);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                const itemId = editingItem ? editingItem.id : Date.now().toString();
                const docRef = window.fbUtils.doc(window.db, 'artifacts', 'collection-app', 'users', user.uid, 'items', itemId);
                
                await window.fbUtils.setDoc(docRef, {
                    ...formData,
                    updatedAt: new Date().toISOString()
                });
                
                setIsModalOpen(false);
                setImagePreview("");
            };

            const deleteItem = async (id) => {
                if (window.confirm('確定要刪除這件珍藏嗎？')) {
                    const docRef = window.fbUtils.doc(window.db, 'artifacts', 'collection-app', 'users', user.uid, 'items', id);
                    await window.fbUtils.deleteDoc(docRef);
                }
            };

            const stats = useMemo(() => {
                const total = items.reduce((sum, i) => sum + (Number(i.price) || 0), 0);
                return { count: items.length, total: total.toLocaleString() };
            }, [items]);

            const filteredItems = items.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()));

            if (loading) return <div className="h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div></div>;

            if (!user) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-50">
                    <Icon name="package" size={64} className="text-indigo-600 mb-6" />
                    <h1 className="text-2xl font-bold mb-2">個人收藏管理系統</h1>
                    <p className="text-slate-500 mb-8">請登入以開始管理您的私藏珍品</p>
                    <button onClick={handleLogin} className="flex items-center gap-3 bg-white border border-slate-200 px-8 py-3 rounded-2xl shadow-sm hover:shadow-md transition-all font-medium">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" />
                        使用 Google 帳號登入
                    </button>
                </div>
            );

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                        <div>
                            <div className="flex items-center gap-3">
                                <img src={user.photoURL} className="w-10 h-10 rounded-full border-2 border-white shadow-sm" />
                                <div>
                                    <h1 className="text-2xl font-bold text-slate-800">你好, {user.displayName}</h1>
                                    <button onClick={handleLogout} className="text-xs text-red-500 hover:underline">登出系統</button>
                                </div>
                            </div>
                        </div>
                        <button onClick={() => { setEditingItem(null); setFormData({name:'', category:'其他', price:'', date:new Date().toISOString().split('T')[0], status:'閒置', image:'', description:''}); setImagePreview(""); setIsModalOpen(true); }} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl flex items-center gap-2 hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">
                            <Icon name="plus" size={18} /> 新增收藏
                        </button>
                    </header>

                    {/* Stats */}
                    <div className="grid grid-cols-2 gap-4 mb-8">
                        <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                            <p className="text-sm text-slate-500 mb-1">藏品數量</p>
                            <p className="text-2xl font-bold text-slate-800">{stats.count}</p>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                            <p className="text-sm text-slate-500 mb-1">資產總估值</p>
                            <p className="text-2xl font-bold text-indigo-600">${stats.total}</p>
                        </div>
                    </div>

                    {/* Search */}
                    <div className="relative mb-6">
                        <Icon name="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
                        <input type="text" placeholder="搜尋我的收藏..." className="w-full pl-12 pr-4 py-3 bg-white rounded-2xl border border-slate-100 shadow-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                    </div>

                    {/* Gallery */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {filteredItems.map(item => (
                            <div key={item.id} className="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm hover:shadow-md transition-all group">
                                <div className="h-48 bg-slate-100 relative">
                                    {item.image ? <img src={item.image} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name="image" size={40} /></div>}
                                    <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => { setEditingItem(item); setFormData(item); setImagePreview(item.image); setIsModalOpen(true); }} className="p-2 bg-white/90 rounded-lg text-slate-600 hover:text-indigo-600"><Icon name="edit-3" size={14}/></button>
                                        <button onClick={() => deleteItem(item.id)} className="p-2 bg-white/90 rounded-lg text-slate-600 hover:text-red-600"><Icon name="trash-2" size={14}/></button>
                                    </div>
                                    <div className="absolute bottom-2 left-2 px-2 py-1 bg-black/50 backdrop-blur-sm rounded text-[10px] text-white uppercase font-bold">{item.category}</div>
                                </div>
                                <div className="p-4">
                                    <h3 className="font-bold text-slate-800 mb-1 truncate">{item.name}</h3>
                                    <div className="flex justify-between items-center">
                                        <span className="text-sm text-indigo-600 font-semibold">${Number(item.price).toLocaleString()}</span>
                                        <span className="text-xs text-slate-400">{item.date}</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-3xl w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-6 border-b flex justify-between items-center">
                                    <h2 className="text-xl font-bold">{editingItem ? '修改資訊' : '加入新收藏'}</h2>
                                    <button onClick={() => setIsModalOpen(false)} className="p-2 hover:bg-slate-100 rounded-full"><Icon name="x" size={20}/></button>
                                </div>
                                <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-4 text-sm">
                                    <div>
                                        <label className="block font-bold mb-1">藏品圖片 (Base64)</label>
                                        <div className="flex gap-4 items-center">
                                            <div className="w-20 h-20 rounded-xl bg-slate-100 flex-shrink-0 overflow-hidden border">
                                                {imagePreview ? <img src={imagePreview} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name="camera" /></div>}
                                            </div>
                                            <input type="file" accept="image/*" onChange={handleImageChange} className="text-xs file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="col-span-2">
                                            <label className="block font-bold mb-1">名稱 *</label>
                                            <input required className="w-full p-2.5 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block font-bold mb-1">類別</label>
                                            <select className="w-full p-2.5 rounded-xl border border-slate-200" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})}>
                                                <option>藝術品</option><option>卡牌</option><option>攝影</option><option>時尚</option><option>其他</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-bold mb-1">估算價值</label>
                                            <input type="number" className="w-full p-2.5 rounded-xl border border-slate-200" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">儲存收藏</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
